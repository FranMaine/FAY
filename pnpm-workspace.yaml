# pnpm 11.23+ reemplazó onlyBuiltDependencies por este mapa -la clave vieja
# queda sin efecto silenciosamente (no da error, simplemente no hace nada),
# que es justo lo que nos pasó: quedó ahí sin bloquear el "ignored builds"
# que rompía "pnpm install" en el runner de GitHub Actions.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  unrs-resolver: true
  # Decisión explícita de NO correrles el script: sin una entrada, pnpm 11
  # corta el install con ERR_PNPM_IGNORED_BUILDS. El de @google/genai es un
  # "prepare" de desarrollo de su propio repo (el paquete publicado ya trae
  # dist/) y el de protobufjs solo avisa por un esquema de versiones.
  "@google/genai": false
  protobufjs: false

# Fuerza versiones parcheadas de dos vulnerabilidades transitivas
# (deepmerge-ts vía @prisma/config, valibot vía @hookform/resolvers) que
# pnpm audit reporta -ninguna de las dos está bajo nuestro control directo
# en package.json porque las trae otra librería, no nosotros.
overrides:
  deepmerge-ts: ">=8.0.0"
  valibot: ">=1.4.2"
  # Alertas de pnpm audit en dependencias de dependencias (zod vía
  # @hookform/resolvers, undici vía @vercel/blob, source-map-js vía postcss,
  # mysql2 vía la herramienta de línea de comandos de Prisma): se fuerzan las
  # versiones corregidas dentro de la misma versión mayor.
  zod: ">=4.6.6"
  undici: ">=6.29.1 <7"
  source-map-js: ">=1.2.2"
  mysql2: ">=3.22.0"
