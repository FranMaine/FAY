name: CI

# Corre en cada push/PR a main la misma batería que se corre a mano antes
# de cada commit en este proyecto (tsc, lint, tests, build) -pensado para
# atajar un error tonto (un typo que rompe el build, un test que queda
# roto) ANTES de que llegue a producción, no recién cuando el deploy ya
# falló o el sitio ya se rompió para los usuarios. No corre los tests e2e
# (e2e/) porque esos necesitan una base de datos real -son para correr a
# mano con `pnpm run test:e2e`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Base Postgres descartable solo para el build: la portada y otras
    # páginas con `revalidate` se prerenderizan al compilar y consultan la
    # base, así que un placeholder ya no alcanza (el build rompía con
    # DatabaseNotReachable en "/"). Arranca vacía: las páginas tienen que
    # poder renderizar sin datos.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        # --frozen-lockfile: garantiza que CI instale exactamente lo que
        # dice pnpm-lock.yaml, sin poder actualizarlo solo -si package.json
        # y el lockfile quedan desincronizados, esto falla acá en vez de
        # instalar algo distinto a lo que corre en producción sin que nadie
        # lo note. (La falla de install que hubo antes no era por esto: era
        # que onlyBuiltDependencies había quedado sin efecto desde pnpm
        # 11.23 -ver el commit que migró a allowBuilds en pnpm-workspace.yaml.)
        run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        # El postinstall del propio proyecto ya corre esto en un pnpm
        # normal, pero algunos entornos bloquean los scripts de instalación
        # por default -este paso explícito hace que CI no dependa de eso:
        # sin el cliente generado, tsc directamente no encuentra los tipos
        # de @prisma/client y todo lo demás falla en cadena.
        run: pnpm exec prisma generate

      - name: Chequeo de tipos
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Tests unitarios
        run: pnpm run test:run

      - name: Esquema de la base de CI
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: pnpm exec prisma db push --accept-data-loss

      - name: Build
        # Contra la base vacía del servicio de arriba (ver el comentario
        # ahí): las páginas con revalidate se prerenderizan en el build.
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          NEXTAUTH_SECRET: "ci-placeholder-secret-not-for-production"
        run: pnpm run build
