name: Respaldo semanal de la base

# Todos los domingos a las 03:00 de Argentina (06:00 UTC) saca una copia
# completa de la base de datos (Neon), la prueba restaurándola en una base
# descartable, la cifra y la deja como "artefacto" de esta tarea durante 90
# días (unas 12 copias semanales). Se descarga desde la pestaña Actions del
# repositorio. Cómo restaurar: docs/respaldos.md.
#
# El repositorio es PÚBLICO, así que la copia se cifra antes de subirla: sin la
# clave (secreto BACKUP_PASSPHRASE) el archivo no sirve para nadie. Hacen
# falta dos secretos en GitHub (Settings > Secrets and variables > Actions):
#   - BACKUP_DATABASE_URL: conexión DIRECTA de Neon (sin "pooler" en el host)
#   - BACKUP_PASSPHRASE: la clave con la que se cifra (guardala también en un
#     administrador de contraseñas: sin ella no se puede abrir ninguna copia)
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo-base
  cancel-in-progress: false

jobs:
  respaldar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Base descartable donde se prueba que la copia se puede restaurar.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: prueba
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prueba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Controlar que estén los secretos
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          CLAVE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$URL" ] || { echo "::error::Falta el secreto BACKUP_DATABASE_URL"; exit 1; }
          [ -n "$CLAVE" ] || { echo "::error::Falta el secreto BACKUP_PASSPHRASE"; exit 1; }

      # El cliente de Postgres tiene que ser de la misma versión que la base
      # (Neon usa la 18) o mayor: el que trae Ubuntu es más viejo y se negaría.
      - name: Instalar pg_dump 18
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Sacar la copia
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          fecha=$(date -u +%Y-%m-%d)
          echo "FECHA=$fecha" >> "$GITHUB_ENV"
          # Formato "custom": comprimido y restaurable por partes con pg_restore.
          /usr/lib/postgresql/18/bin/pg_dump "$URL" --format=custom --no-owner --no-privileges --file="orzando-$fecha.dump"
          ls -l "orzando-$fecha.dump"

      - name: Probar que se puede restaurar
        run: |
          # Una copia demasiado chica es señal de que algo salió mal.
          tam=$(stat -c %s "orzando-$FECHA.dump")
          [ "$tam" -gt 20000 ] || { echo "::error::La copia pesa solo $tam bytes"; exit 1; }
          /usr/lib/postgresql/18/bin/pg_restore --no-owner --no-privileges --dbname="postgresql://prueba:prueba@localhost:5432/prueba" "orzando-$FECHA.dump"
          filas=$(psql "postgresql://prueba:prueba@localhost:5432/prueba" -tAc 'select count(*) from "Regatista"')
          echo "Regatistas en la copia restaurada: $filas"
          [ "$filas" -gt 0 ] || { echo "::error::La copia restaurada no tiene regatistas"; exit 1; }

      - name: Cifrar
        env:
          CLAVE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$CLAVE" --symmetric --cipher-algo AES256 --output "orzando-$FECHA.dump.gpg" "orzando-$FECHA.dump"
          rm "orzando-$FECHA.dump"
          ls -l

      - name: Guardar la copia
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-orzando-${{ env.FECHA }}
          path: orzando-${{ env.FECHA }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
